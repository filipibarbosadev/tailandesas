<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Catálogo de camisas das principais seleções do mundo.">
    <title>Seleções | Mantos FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body class="catalog-page">
    <main class="catalog-shell">
        <a class="catalog-top-back" href="index.html">← Menu principal</a>

        <header class="catalog-header">
            <div>
                <p class="catalog-kicker">Mantos FC / Catálogo</p>
                <h1>Seleções</h1>
            </div>
            <p>Encontre camisas das seleções que fazem história no futebol mundial.</p>
        </header>

        <section class="catalog-toolbar" aria-label="Busca no catálogo">
            <label class="visually-hidden" for="filtro-selecoes">Buscar seleção</label>
            <input class="catalog-control" id="filtro-selecoes" type="search" placeholder="Buscar por seleção ou modelo..." autocomplete="off">
        </section>

        <div class="catalog-meta">
            <span>Camisas disponíveis</span>
            <span class="catalog-count" id="selecoes-count" aria-live="polite"></span>
        </div>

        <section class="catalog-grid" id="selecoes-container" aria-live="polite"></section>
        <p class="catalog-empty" id="selecoes-empty" hidden>Nenhuma seleção encontrada com essa busca.</p>

        <nav class="catalog-pagination" id="selecoes-pagination" aria-label="Paginação do catálogo">
            <button class="catalog-page-button" id="selecoes-previous" type="button">← Anterior</button>
            <span class="catalog-page-status" id="selecoes-page-status" aria-live="polite"></span>
            <button class="catalog-page-button" id="selecoes-next" type="button">Próxima →</button>
        </nav>

        <a class="catalog-back" href="index.html">← Voltar para a página inicial</a>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
